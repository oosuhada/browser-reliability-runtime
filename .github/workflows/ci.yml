name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Atomic queue claim regression
        run: npm run test:queue-claim

      - name: Atomic queue storage regression
        run: npm run test:queue-storage

      - name: Retry backoff policy regression
        run: npm run test:retry-policy

      - name: Build
        run: npm run build
